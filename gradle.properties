android.useAndroidX=true

# ============================
#   OPTIMIZACIÓN DE MEMORIA
# ============================

# Gradle Daemon: 4 GB
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin Daemon: 4 GB
kotlin.daemon.jvm.options=-Xmx4096m

# ============================
#   OPTIMIZACIÓN DE COMPILACIÓN
# ============================

# Compilación paralela
org.gradle.parallel=true

# Compilación incremental
org.gradle.caching=true

# Evita reconfigurar módulos innecesariamente
org.gradle.configureondemand=true

# ============================
#   OPTIMIZACIÓN PARA KOTLIN
# ============================

# Incremental Kotlin
kotlin.incremental=true
kotlin.code.style=official

# ============================
#   OPTIMIZACIÓN PARA ANDROID
# ============================

# Evita builds lentos por verificación de recursos
android.nonTransitiveRClass=true

# Evita merges innecesarios
android.enableJetifier=false

# ============================
#   OPTIMIZACIÓN PARA COMPOSE
# ============================

# Compose Compiler optimizado
android.compose.compiler.report=true
android.compose.compiler.metrics=true

# ============================
#   NETWORK / IO
# ============================

# Evita timeouts en máquinas rápidas
org.gradle.daemon=true
org.gradle.workers.max=8



