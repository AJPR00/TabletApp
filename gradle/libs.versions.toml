[versions]

# --- Android / Kotlin base ---
agp = "8.13.0"                     # Plugin de Android. Sin esto no compila ni arranca.
kotlin = "2.2.20"                  # Versión del lenguaje Kotlin.
javaxInject = "1"                  # Inyección básica (útil para casos sin Hilt).

# --- Core Android ---
coreKtx = "1.17.0"                 # Extensiones modernas de Android. Evita boilerplate.

# --- Testing ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# --- Lifecycle / Compose ---
lifecycleRuntimeKtx = "2.9.4"      # Para ViewModels y ciclos de vida modernos.
lifecycleViewModel = "2.8.0"
lifecycleRuntime = "2.8.0"

activityCompose = "1.11.0"         # Para actividades basadas en Compose.
composeBom = "2025.10.00"          # BOM: controla versiones de Compose automáticamente.
composeUi = "1.7.0"
foundationLayout = "1.9.5"

# --- Multimedia ---
media3 = "1.8.0"                   # ExoPlayer moderno. Reproduce vídeo sin dramas.
coil = "2.7.0"                     # Carga imágenes rápido y fácil.

# --- Base de datos ---
room = "2.8.3"                     # Room: la BD oficial de Android. Estable y segura.

# --- Dependency Injection ---
hilt = "2.57.2"                    # Hilt: DI oficial. Mucho mejor que Dagger puro.
hiltNavigationCompose = "1.3.0"

# --- Navegación ---
navigationCompose = "2.9.6"        # Navegación declarativa para Compose.

# --- Serialización ---
kotlinSerialization = "1.9.0"      # JSON moderno sin Gson. Rápido y multiplataforma.

# --- Corrutinas ---
coroutines = "1.8.0"               # Hilos ligeros. La base de todo lo asíncrono.

# --- KSP ---
ksp = "2.2.20-2.0.3"               # Procesador de anotaciones moderno (mejor que kapt).

# --- Google APIs ---
googleApiClient = "2.8.1"
googleDriveApi = "v3-rev20220815-2.0.0"

# --- Autenticación ---
credentials = "1.5.0"
googleid = "1.1.1"

# --- Facebook ---
facebookLogin = "18.1.3"

# --- Firebase ---
firebaseBom = "34.7.0"
googleServices = "4.4.2"

# --- DataStore ---
datastore = "1.1.1"                # Reemplazo moderno de SharedPreferences.

# --- Networking ---
retrofit = "3.0.0"                 # Retrofit 3: API HTTP estable y fácil.
okhttp = "5.3.2"                   # Cliente HTTP base. Retrofit lo usa por debajo.

# --- Utilidades ---
commonsNet = "3.9.0"               # FTP y protocolos viejos. Útil para compatibilidad.
desugar = "2.0.3"                  # Permite usar APIs modernas en Android viejo.

# --- UI Legacy ---
appcompat = "1.7.1"
material = "1.13.0"

# --- CameraX ---
camerax = "1.4.0"

# --- CrearQR ---
zxing = "3.5.3"


[libraries]

# --- Core Android ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# --- Testing ---
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# --- Lifecycle ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewModel" }

# --- Activity Compose ---
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Compose BOM ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# --- Compose UI ---
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# --- Material ---
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Google Fonts ---
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }

# --- Foundation Layout ---
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }

# --- Media3 (ExoPlayer moderno) ---
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# --- Room (Base de datos local) ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Coil (Imágenes) ---
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }

# --- Hilt (Inyección de dependencias) ---
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Navegación ---
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Serialización ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }

# --- Corrutinas ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Google API / Drive ---
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "googleApiClient" }
google-api-services-drive = { group = "com.google.apis", name = "google-api-services-drive", version.ref = "googleDriveApi" }

# --- Retrofit / OkHttp ---
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# --- Credential Manager ---
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }

# --- Google Identity ---
google-identity = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# --- Firebase ---
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# --- Facebook Login ---
facebook-login = { module = "com.facebook.android:facebook-login", version.ref = "facebookLogin" }

# --- DataStore ---
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }

# --- FTP ---
commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }

# --- Desugaring ---
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# --- UI Legacy ---
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# --- Servidor local (NanoHTTPD) ---
nanohttpd = { module = "org.nanohttpd:nanohttpd", version = "2.3.1" }   # Servidor HTTP ligero para LAN. Perfecto para tablets viejas.

# --- CameraX ---
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# --- CrearQR ---
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
